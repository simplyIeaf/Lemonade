name: Build Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            rbxdom/target
          key: ${{ runner.os }}-cargo-rbxdom-${{ hashFiles('rbxdom/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rbxdom-

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - name: Build rbx-dom native libraries for every Android architecture
        working-directory: rbxdom
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cargo ndk --platform 24 -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o ../app/src/main/jniLibs build --release
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -s ../app/src/main/jniLibs/$abi/liblemonade_rbxdom.so
          done
          ls -l ../app/src/main/jniLibs/*/

      - name: Commit updated native libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/src/main/jniLibs
          if git diff --cached --quiet; then
            echo "Native libraries are already up to date"
          else
            git commit -m "Update rbx-dom native libraries"
            git push
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Read version info
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/lemonade-debug-${{ steps.version.outputs.version_name }}-${{ github.sha }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: lemonade-debug-apk
          path: out/lemonade-debug-${{ steps.version.outputs.version_name }}-${{ github.sha }}.apk
          retention-days: 30
